[project]
name = "aeo-from-scratch"
version = "0.1.0"
description = "The course's shared package, installed in place."
requires-python = ">=3.12"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["aeolab"]

[tool.setuptools.package-data]
aeolab = ["*.csv", "data/*.json", "runs/*.jsonl", "web/**/*"]
